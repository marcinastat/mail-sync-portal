# Jaile fail2ban dla VM2. VM2 nie ma nginx/Roundcube/panelu, więc jedyną
# powierzchnią logowania jest SSH — a zwykli użytkownicy logują się HASŁEM
# (polityka SSH w 60-firewall-rules.sh: root tylko kluczem, użytkownicy hasłem),
# więc jail sshd jest tu realną ochroną przed brute-force.
#
# WAŻNE: fail2ban 0.11+/1.x NIE włącza żadnego jaila domyślnie (w jail.conf
# wszystkie mają enabled=false) — bez tego pliku `fail2ban-client status` pokazuje
# 0 jaili i nic nie jest chronione.
#
# backend=systemd: Rocky 10 Minimal nie ma rsyslog ani /var/log/secure (sshd
# loguje wyłącznie do journald). Domyślny plikowy backend szukałby nieistniejącego
# logpath, a fail2ban odmawia startu w ogóle, gdy logpath któregokolwiek jaila nie
# istnieje. Czytamy więc zdarzenia sshd wprost z journala.
[sshd]
enabled  = true
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 1h
