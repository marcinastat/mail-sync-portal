# Utwardzenie SSH (portal). Plik 00-* jest czytany PRZED innymi drop-inami
# (np. 01-permitrootlogin.conf z obrazu), a w sshd wygrywa PIERWSZA uzyskana
# wartosc — dlatego te ustawienia maja pierwszenstwo.
#
# Polityka: ROOT wylacznie kluczem (prohibit-password); zwykli uzytkownicy moga
# logowac sie HASLEM (chroni ich fail2ban jail sshd). Dzieki temu instalacja
# sudo-userem po hasle dziala dalej po hardeningu. Linia PermitRootLogin jest
# instalowana tylko, gdy root ma juz klucz — inaczej odcielaby roota (patrz
# skrypty 10-base-hardening.sh / 60-firewall-rules.sh).
PermitRootLogin prohibit-password
PasswordAuthentication yes
KbdInteractiveAuthentication no

# --- Dodatkowe utwardzenie (audyt 2026-07) --------------------------------
# Wylacz X11 forwarding (serwer bez GUI), skroc okno logowania i limit prob,
# dodaj idle-timeout zrywajacy porzucone sesje.
X11Forwarding no
LoginGraceTime 30
MaxAuthTries 4
ClientAliveInterval 300
ClientAliveCountMax 2
# UWAGA: MAC-i/Ciphers/Kex NIE ustawiamy tutaj celowo — na Rocky rzadzi nimi
# systemowa crypto-policy (DEFAULT), ktora sshd czyta PRZED tym drop-inem, wiec
# linia MACs= i tak byłaby martwa. HMAC-SHA1 (jako ETM-HMAC) zostaje: usuniecie
# go poszłoby przez update-crypto-policies na CALY system i mogłoby zerwac
# imapsync do starszych zrodlowych serwerow IMAP. To swiadomy kompromis.
