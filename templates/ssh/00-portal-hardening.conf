# Utwardzenie SSH (portal). Plik 00-* jest czytany PRZED innymi drop-inami
# (np. 01-permitrootlogin.conf z obrazu), a w sshd wygrywa PIERWSZA uzyskana
# wartosc — dlatego te ustawienia maja pierwszenstwo.
#
# Polityka: ROOT wylacznie kluczem (prohibit-password); zwykli uzytkownicy moga
# logowac sie HASLEM (chroni ich fail2ban jail sshd). Dzieki temu instalacja
# sudo-userem po hasle dziala dalej po hardeningu. Linia PermitRootLogin jest
# instalowana tylko, gdy root ma juz klucz — inaczej odcielaby roota (patrz
# skrypty 10-base-hardening.sh / 60-firewall-rules.sh).
PermitRootLogin prohibit-password
PasswordAuthentication yes
KbdInteractiveAuthentication no
